name: Daily digest

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC, ~07:00 Munich winter
  workflow_dispatch:  # allow manual trigger from Actions tab

permissions:
  contents: read

# Opt in early to Node.js 24 for the action runtimes (default June 2nd, 2026).
# Removes the deprecation warning. Set globally so all jobs and steps inherit.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Restore DB cache
        uses: actions/cache@v4
        with:
          path: jobs.db
          key: jobs-db-${{ github.run_number }}
          restore-keys: |
            jobs-db-

      - name: Scrape sources
        run: uv run python main.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Send digest
        run: uv run python -m src.digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
          PYTHONUNBUFFERED: "1"